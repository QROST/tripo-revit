name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-gate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore full Windows solution
        if: runner.os == 'Windows'
        run: dotnet restore Tripo.Revit.sln
      - name: Build full Windows solution
        if: runner.os == 'Windows'
        run: dotnet build Tripo.Revit.sln --configuration Release --no-restore
      - name: Test full Windows solution
        if: runner.os == 'Windows'
        run: dotnet test Tripo.Revit.sln --configuration Release --no-build
      - name: Restore portable macOS subset
        if: runner.os == 'macOS'
        run: dotnet restore Tripo.Revit.Portable.slnf /p:SkipRevitHostBuild=true
      - name: Build portable macOS subset
        if: runner.os == 'macOS'
        run: dotnet build Tripo.Revit.Portable.slnf --configuration Release --no-restore /p:SkipRevitHostBuild=true
      - name: Test portable macOS subset
        if: runner.os == 'macOS'
        run: dotnet test Tripo.Revit.Portable.slnf --configuration Release --no-build /p:SkipRevitHostBuild=true

name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-gate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore portable macOS subset
        run: dotnet restore Tripo.Revit.Portable.slnf /p:SkipRevitHostBuild=true
      - name: Build portable macOS subset
        run: dotnet build Tripo.Revit.Portable.slnf --configuration Release --no-restore /p:SkipRevitHostBuild=true
      - name: Test portable macOS subset
        run: dotnet test Tripo.Revit.Portable.slnf --configuration Release --no-build /p:SkipRevitHostBuild=true
      - name: Test release candidate assembly with synthetic files
        shell: pwsh
        run: ./packaging/Test-ReleaseCandidate.ps1

  windows-full-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore full Windows solution (Revit 2026 host)
        run: dotnet restore Tripo.Revit.sln /p:RevitYear=2026
      - name: Build full Windows solution (Revit 2026 host)
        run: dotnet build Tripo.Revit.sln --configuration Release --no-restore /p:RevitYear=2026
      - name: Test full Windows solution
        env:
          TRIPO_RUN_WINDOWS_CREDENTIAL_MANAGER_CANARY: "1"
        run: dotnet test Tripo.Revit.sln --configuration Release --no-build
      - name: Test release candidate assembly with synthetic files
        shell: pwsh
        run: ./packaging/Test-ReleaseCandidate.ps1

  windows-host-matrix:
    strategy:
      fail-fast: false
      matrix:
        revit_year: [2025, 2026]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Revit host (${{ matrix.revit_year }})
        run: dotnet restore src/Tripo.Revit/Tripo.Revit.csproj /p:RevitYear=${{ matrix.revit_year }}
      - name: Build Revit host (${{ matrix.revit_year }})
        run: dotnet build src/Tripo.Revit/Tripo.Revit.csproj --configuration Release --no-restore /p:RevitYear=${{ matrix.revit_year }}
      - name: Verify Revit host output (${{ matrix.revit_year }})
        shell: pwsh
        run: |
          $root = "src/Tripo.Revit/bin/Release/net8.0-windows/${{ matrix.revit_year }}"
          foreach ($path in @(
            "$root/Tripo.Revit.dll",
            "$root/Tripo.Revit.addin",
            "$root/sidecar/Tripo.Revit.Mcp.dll"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected host output missing: $path"
            }
          }

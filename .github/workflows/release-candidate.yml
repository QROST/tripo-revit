name: release-candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (must match VERSION, e.g. v0.1.1)"
        required: true
        type: string
        default: "v0.1.1"
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}".Trim()
          } else {
            "${{ github.ref_name }}".Trim()
          }
          if (-not $requested) { throw "Version is empty." }
          if (-not $requested.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $requested = "v$requested"
          }
          if ($requested -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$requested' is not a canonical release tag."
          }
          "tag=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ref=refs/tags/$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Using version tag $requested"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.version.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Requested tag '$tag' does not exist. Create and review the tag before running this workflow."
          }

          $tagCommit = (git rev-list -n 1 "$tag^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -cne $headCommit) {
            throw "Checked-out commit '$headCommit' does not match tag '$tag' commit '$tagCommit'."
          }

          $declaredVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($tag -cne "v$declaredVersion") {
            throw "Tag '$tag' does not match VERSION '$declaredVersion'."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-WebRequest `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
            -Headers $headers `
            -Method Get `
            -SkipHttpErrorCheck
          if ([int]$release.StatusCode -eq 200) {
            throw "Release '$tag' already exists. Existing releases and assets are immutable."
          }
          if ([int]$release.StatusCode -ne 404) {
            throw "Could not prove that release '$tag' is absent (HTTP $([int]$release.StatusCode))."
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Tripo.Revit.sln /p:RevitYear=2026
      - name: Build Revit 2025 host (compile gate)
        run: dotnet build src/Tripo.Revit/Tripo.Revit.csproj --configuration Release /p:RevitYear=2025
      - name: Build full solution (Revit 2026 host)
        run: dotnet build Tripo.Revit.sln --configuration Release --no-restore /p:RevitYear=2026
      - name: Test
        run: dotnet test Tripo.Revit.sln --configuration Release --no-build
      - name: Assemble candidate
        shell: pwsh
        run: ./packaging/New-ReleaseCandidate.ps1 -Version "${{ steps.version.outputs.tag }}"
      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tripo-revit-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $isPrerelease = $true
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $isPrerelease = [System.Convert]::ToBoolean("${{ inputs.prerelease }}")
          }

          $zip = Get-ChildItem -LiteralPath artifacts -Filter "*.zip" | Select-Object -First 1
          $sha = Get-ChildItem -LiteralPath artifacts -Filter "*.sha256" | Select-Object -First 1
          if (-not $zip -or -not $sha) {
            throw "Release assets missing under artifacts/."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          ## Experimental pre-release

          Tripo-Revit community adapter package for Autodesk Revit **2025** and **2026** (Windows x64, .NET 8).

          This is **not** a production release. Binaries are **unsigned**. There is no installer or automatic update. Revit **2025** and **2026** are both Best-effort targets until exact-year real-host smoke receipts exist. Treat this as an experimental install for technical users.

          ### Requirements
          - Windows x64 + Autodesk Revit 2025 or 2026 (install only the matching `Addins/YYYY` tree)
          - Your own Tripo v3 API key (BYOK); usage is subject to Tripo's terms
          - .NET 8 runtime for the optional MCP sidecar path

          ### Package contents
          - `Addins/2025/` and `Addins/2026/` — per-user Revit add-in layouts (`.addin` + `TripoRevit/` including bundled `sidecar/`)
          - `mcp/` — optional standalone MCP server output
          - `README.md` / `README.zh-CN.md` — install and usage
          - matching `.sha256` checksum sidecar

          ### Install (summary)
          Close Revit, then copy the matching `Addins/YYYY` contents into `%APPDATA%\Autodesk\Revit\Addins\YYYY\` as documented in the README. Verify the SHA-256 sidecar before installing.

          Not affiliated with or endorsed by Tripo or Autodesk. Licensed under Apache-2.0.

          ## 中文摘要
          实验性预发布包：Windows x64 + Revit 2025/2026（.NET 8）；未签名；无安装器；需自备 Tripo API key。2025 与 2026 在分别取得真实宿主冒烟收据前都仅为 Best-effort。请按 README 将对应 `Addins/YYYY` 拷入 `%APPDATA%\Autodesk\Revit\Addins\YYYY\`，并先校验 `.sha256`。
          '@.Replace("          ", "") | Set-Content -LiteralPath $notesPath -Encoding utf8

          $args = @(
            "release", "create", $tag,
            $zip.FullName, $sha.FullName,
            "--verify-tag",
            "--title", "Tripo-Revit $tag (experimental)",
            "--notes-file", $notesPath
          )
          if ($isPrerelease) { $args += "--prerelease" }
          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "Creating release '$tag' failed. No existing release or asset was changed."
          }
